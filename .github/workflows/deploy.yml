name: Build, Test & Deploy ALINCE LOGISTICS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Suite
        run: npm test

      - name: Build Production Assets
        env:
          VITE_API_BASE_URL: /api
          VITE_USE_MOCK: 'true'
          VITE_APP_NAME: 'ALINCE LOGISTICS'
          VITE_APP_CURRENCY: 'PKR'
          VITE_APP_REGION: 'Pakistan'
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Deploy to Ubuntu Droplet via SSH & Rsync
        if: env.DROPLET_HOST != ''
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET_DIR: /var/www/alince-logistics
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" dist/ "$DROPLET_USER@$DROPLET_HOST:$TARGET_DIR/"
          ssh -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" "sudo chown -R www-data:www-data $TARGET_DIR && sudo chmod -R 755 $TARGET_DIR"
